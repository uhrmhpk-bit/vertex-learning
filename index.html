  const grid = document.getElementById('excelGrid');
  const nameBox = document.getElementById('nameBox');
  const formulaBar = document.getElementById('formulaBar');

  const cellSets = extractCellSets(step.todo + ' ' + (step.steps_ops||[]).join(' '));
  cellSets.targetAddrs.forEach(addr=>{
    const td = grid.querySelector(`td[data-addr="${addr}"]`);
    if(td) td.classList.add('target-cell');
  });
  cellSets.refAddrs.forEach(addr=>{
    const td = grid.querySelector(`td[data-addr="${addr}"]`);
    if(td) td.classList.add('ref-cell');
  });

  function freshSheet(){ return makeSheet(values, styles); }

  function refreshAllDisplays(){
    const sheet = freshSheet();
    grid.querySelectorAll('input.cell-input').forEach(inp=>{
      const addr = inp.dataset.addr;
      if(addr === ctx.selectedAddr && document.activeElement === inp) return;
      inp.value = formatDisplay(sheet.value(addr), (styles[addr]||{}).format, (styles[addr]||{}).decimals);
    });
    grid.querySelectorAll('td[data-addr]').forEach(td=>{
      const addr = td.dataset.addr; const st = styles[addr]||{};
      td.classList.toggle('bold', !!st.bold);
      td.classList.toggle('center', st.align==='center');
      td.classList.toggle('right', st.align==='right');
      td.classList.toggle('fill', !!st.fill);
      td.classList.toggle('border-box', !!st.border && !st.edges);
      if(st.edges){
        const px = w=> w==='thick' ? 3 : (w==='thin' ? 1 : 0);
        const e = st.edges, sh = [];
        if(px(e.t)) sh.push(`inset 0 ${px(e.t)}px 0 0 var(--text)`);
        if(px(e.b)) sh.push(`inset 0 -${px(e.b)}px 0 0 var(--text)`);
        if(px(e.l)) sh.push(`inset ${px(e.l)}px 0 0 0 var(--text)`);
        if(px(e.r)) sh.push(`inset -${px(e.r)}px 0 0 0 var(--text)`);
        td.style.boxShadow = sh.join(',');
      } else if(td.style.boxShadow){ td.style.boxShadow = ''; }
      td.classList.toggle('locked', !!ctx.locked[addr]);
      td.classList.toggle('rule-set', !!ctx.ruleSet[addr]);
    });
  }

  function addrParts(addr){ const m = addr.match(/^([A-Z]+)(\d+)$/); return {col:m[1], row:Number(m[2])}; }
  function neighborAddr(addr, dir){
    const {col, row} = addrParts(addr);
    const colIdx = colToIndex(col);
    if(dir==='up') return row>1 ? col+(row-1) : null;
    if(dir==='down') return row<rows ? col+(row+1) : null;
    if(dir==='left') return colIdx>0 ? indexToCol(colIdx-1)+row : null;
    if(dir==='right') return colIdx<cols-1 ? indexToCol(colIdx+1)+row : null;
    return null;
  }
  function moveToCell(addr){
    const nextInput = grid.querySelector(`input[data-addr="${addr}"]`);
    if(nextInput){ nextInput.focus(); nextInput.select(); }
  }

  function clearRangeHighlight(){ grid.querySelectorAll('td.in-range').forEach(td=>td.classList.remove('in-range')); }
  function updateRangeHighlight(){
    clearRangeHighlight();
    if(!ctx.selectedRange) return;
    const {r1,c1,r2,c2} = ctx.selectedRange;
    for(let r=r1;r<=r2;r++){ for(let c=c1;c<=c2;c++){ const addr = indexToCol(c)+r; const td = grid.querySelector(`td[data-addr="${addr}"]`); if(td) td.classList.add('in-range'); } }
  }

  function selectCell(addr){
    ctx.selectedAddr = addr; ctx.selectedRange = null;
    clearRangeHighlight();
    grid.querySelectorAll('td.selected').forEach(td=>td.classList.remove('selected'));
    const td = grid.querySelector(`td[data-addr="${addr}"]`);
    if(td) td.classList.add('selected');
    nameBox.value = addr;
    formulaBar.value = values[addr] || '';
  }

  function setRange(r1,c1,r2,c2, opts){
    opts = opts || {};
    ctx.selectedRange = {r1:Math.min(r1,r2), c1:Math.min(c1,c2), r2:Math.max(r1,r2), c2:Math.max(c1,c2), wholeRow: !!opts.wholeRow, wholeCol: !!opts.wholeCol};
    updateRangeHighlight();
  }

  function selectionAddrs(){
    if(ctx.selectedRange){
      const {r1,c1,r2,c2} = ctx.selectedRange; const addrs=[];
      for(let r=r1;r<=r2;r++){ for(let c=c1;c<=c2;c++){ addrs.push(indexToCol(c)+r); } }
      return addrs;
    }
    return ctx.selectedAddr ? [ctx.selectedAddr] : [];
  }

  function isFormulaEditing(){
    if(!(activeFormulaEl && document.activeElement === activeFormulaEl && activeFormulaEl.value.trim().startsWith('='))) return false;
    // すでにセル参照を挿入している最中なら、そのまま参照の選び直しを続ける
    if(formulaRefAnchor && formulaRefAnchor.el === activeFormulaEl) return true;
    // 本物のExcelと同じく、「＝」「＋」「(」「,」などの直後にカーソルがあるときだけ、セルのクリックで参照を挿入する
    // （式が書き終わっているときや、式の途中をクリックしただけのときは、通常のセル選択として扱う）
    const pos = activeFormulaEl.selectionStart;
    if(pos == null) return true;
    const before = activeFormulaEl.value.slice(0, pos).trimEnd();
    const ch = before.slice(-1);
    return ch !== '' && '=+-*/^&(,:<>'.indexOf(ch) >= 0;
  }
  function insertRefAtCursor(el, targetAddr, refText){
    const start = el.selectionStart != null ? el.selectionStart : el.value.length;
    const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
    const newVal = el.value.slice(0,start) + refText + el.value.slice(end);
    el.value = newVal;
    values[targetAddr] = newVal;
    const newPos = start + refText.length;
    el.focus();
    el.setSelectionRange(newPos, newPos);
    const cellInput = grid.querySelector(`input[data-addr="${targetAddr}"]`);
    if(cellInput && cellInput !== el) cellInput.value = newVal;
    if(formulaBar !== el) formulaBar.value = newVal;
    refreshAllDisplays();
    return {start, end:newPos};
  }
  function replaceSpan(el, targetAddr, spanStart, spanEnd, refText){
    const newVal = el.value.slice(0,spanStart) + refText + el.value.slice(spanEnd);
    el.value = newVal;
    values[targetAddr] = newVal;
    const newPos = spanStart + refText.length;
    el.focus();
    el.setSelectionRange(newPos, newPos);
    const cellInput = grid.querySelector(`input[data-addr="${targetAddr}"]`);
    if(cellInput && cellInput !== el) cellInput.value = newVal;
    if(formulaBar !== el) formulaBar.value = newVal;
    refreshAllDisplays();
    return {start:spanStart, end:newPos};
  }

  function fillDown(sourceAddr, destAddr){
    const sp = addrParts(sourceAddr), dp = addrParts(destAddr);
    if(sp.col !== dp.col || dp.row <= sp.row) return;
    const sourceRaw = values[sourceAddr] || '';
    for(let r=sp.row+1; r<=dp.row; r++){
      const addr = sp.col + r;
      values[addr] = adjustFormula(sourceRaw, r - sp.row);
    }
    ctx.sorted = ctx.sorted; // no-op, keep lints happy
    refreshAllDisplays();
  }

  function performSort(range, keyOffset, order){
    const {r1,c1,r2,c2} = range;
    const rowsData = [];
    for(let r=r1;r<=r2;r++){ const rowVals=[]; for(let c=c1;c<=c2;c++){ rowVals.push(values[indexToCol(c)+r]); } rowsData.push(rowVals); }
    rowsData.sort((a,b)=>{ const av=Number(a[keyOffset]), bv=Number(b[keyOffset]); return order==='desc' ? bv-av : av-bv; });
    for(let i=0;i<rowsData.length;i++){
      const r = r1+i;
      for(let c=c1;c<=c2;c++){ values[indexToCol(c)+r] = rowsData[i][c-c1]; }
    }
    grid.querySelectorAll('input.cell-input').forEach(inp=>{ inp.value = values[inp.dataset.addr] || ''; });
    refreshAllDisplays();
  }

  const CHART_COLORS = ['#0239a6','#4a78d0','#8fadea','#4a5d80','#022a7a','#9aa6bd'];
  function drawChartBody(){
    const d = ctx._chartData; const body = document.getElementById('chartBody');
    if(!d || !body) return;
    const title = (ctx.chartTitle||'').trim();
    let html = title ? `<div class="chart-title-main">${esc(title)}</div>` : '<div class="chart-title-main empty">（グラフタイトルは未設定です）</div>';
    if(ctx.chartType==='bar'){
      html += d.rowsData.map(x=>{
        const pct = Math.max(4, Math.round(x.val/d.maxVal*100));
        return `<div class="chart-bar-row"><span class="chart-bar-label">${esc(x.label)}</span><span class="chart-bar-track"><span class="chart-bar-fill" style="width:${pct}%;background:${CHART_COLORS[0]};"></span></span><span class="chart-bar-val">${esc(String(x.val))}</span></div>`;
      }).join('');
    } else {
      html += '<div class="vchart-cols">' + d.rowsData.map(x=>{
        const h = Math.max(6, Math.round(x.val/d.maxVal*140));
        return `<div class="vcol"><span class="vval">${esc(String(x.val))}</span><span class="vbar" style="height:${h}px;background:${CHART_COLORS[0]};"></span></div>`;
      }).join('') + '</div><div class="vlabels">' + d.rowsData.map(x=>`<span>${esc(x.label)}</span>`).join('') + '</div>';
    }
    if(ctx.chartLegend) html += `<div class="chart-legend"><span class="chart-legend-sw" style="background:${CHART_COLORS[0]};"></span>${esc(d.series)}</div>`;
    body.innerHTML = html;
  }
  function renderChartWithOpts(range){
    const {r1,c1,r2,c2} = range;
    const sheet = freshSheet();
    const preview = document.getElementById('chartPreview');
    if(!preview) return;
    const vc = indexToCol(c1+1<=c2 ? c1+1 : c2);
    const firstVal = sheet.value(vc+r1);
    let series = '系列1', start = r1;
    if(typeof firstVal==='string' && firstVal.trim()!=='' && isNaN(Number(firstVal))){ series = firstVal; start = r1+1; }
    else if(r1>1){ const h = sheet.value(vc+(r1-1)); if(typeof h==='string' && h.trim()!=='') series = h; }
    const rowsData = []; let maxVal = 1;
    for(let r=start;r<=r2;r++){
      const label = sheet.value(indexToCol(c1)+r);
      const val = sheet.value(vc+r);
      const num = typeof val === 'number' ? val : 0;
      if(num > maxVal) maxVal = num;
      rowsData.push({label: label===''?'':String(label), val:num});
    }
    ctx._chartData = {rowsData, maxVal, series};
    ctx.chartSeries = series;
    preview.style.display = 'block';
    if(!document.getElementById('chartBody')){
      preview.innerHTML = `
        <div class="chart-preview-title">📊 作成されたグラフ</div>
        <div class="chart-opts">
          <label>種類
            <select id="chartTypeSel"><option value="col">縦棒グラフ</option><option value="bar">横棒グラフ</option></select>
          </label>
          <label>タイトル <input type="text" id="chartTitleInp" placeholder="グラフタイトル" autocomplete="off"></label>
          <label><input type="checkbox" id="chartLegendChk"> 凡例を表示</label>
        </div>
        <div id="chartBody"></div>`;
      const typeSel = document.getElementById('chartTypeSel'), titleInp = document.getElementById('chartTitleInp'), legendChk = document.getElementById('chartLegendChk');
      typeSel.value = ctx.chartType; titleInp.value = ctx.chartTitle; legendChk.checked = !!ctx.chartLegend;
      typeSel.addEventListener('change', ()=>{ ctx.chartType = typeSel.value; drawChartBody(); });
      titleInp.addEventListener('input', ()=>{ ctx.chartTitle = titleInp.value; drawChartBody(); });
      legendChk.addEventListener('change', ()=>{ ctx.chartLegend = legendChk.checked; drawChartBody(); });
    }
    drawChartBody();
  }
  function renderChart(range){
    if(step.tools && step.tools.includes('chartOpts')){ renderChartWithOpts(range); return; }
    const {r1,c1,r2,c2} = range;
    const sheet = freshSheet();
    const preview = document.getElementById('chartPreview');
    if(!preview) return;
    const rowsData = [];
    let maxVal = 1;
    for(let r=r1;r<=r2;r++){
      const label = sheet.value(indexToCol(c1)+r);
      const val = sheet.value(indexToCol(c1+1<=c2?c1+1:c2)+r);
      const num = typeof val === 'number' ? val : 0;
      if(num > maxVal) maxVal = num;
      rowsData.push({label: label===''?'':String(label), val:num});
    }
    preview.style.display = 'block';
    preview.innerHTML = '<div class="chart-preview-title">📊 作成されたグラフ（棒グラフ）</div>' + rowsData.map((d,i)=>{
      const pct = Math.max(4, Math.round(d.val/maxVal*100));
      const color = CHART_COLORS[i % CHART_COLORS.length];
      return `
      <div class="chart-bar-row">
        <span class="chart-bar-label">${esc(d.label)}</span>
        <span class="chart-bar-track"><span class="chart-bar-fill" style="width:${pct}%;background:${color};"></span></span>
        <span class="chart-bar-val">${esc(String(d.val))}</span>
      </div>`;
    }).join('');
  }

  /* セル入力欄のイベント */
  grid.querySelectorAll('input.cell-input').forEach(inp=>{
    inp.addEventListener('focus', ()=>{ selectCell(inp.dataset.addr); inp.value = values[inp.dataset.addr] || ''; activeFormulaEl = inp; activeFormulaAddr = inp.dataset.addr; formulaRefAnchor = null; });
    inp.addEventListener('input', ()=>{
      values[inp.dataset.addr] = inp.value;
      if(ctx.selectedAddr === inp.dataset.addr) formulaBar.value = inp.value;
      formulaRefAnchor = null;
      refreshAllDisplays();
    });
    inp.addEventListener('blur', ()=>{ refreshAllDisplays(); });
    inp.addEventListener('keydown', (e)=>{
      if(e.isComposing || e.keyCode === 229) return;
      if(e.key === 'Enter'){
        e.preventDefault();
        const next = neighborAddr(inp.dataset.addr, 'down');
        if(next) moveToCell(next); else inp.blur();
        return;
      }
      if(e.key === 'ArrowUp'){ const n=neighborAddr(inp.dataset.addr,'up'); if(n){ e.preventDefault(); moveToCell(n); } return; }
      if(e.key === 'ArrowDown'){ const n=neighborAddr(inp.dataset.addr,'down'); if(n){ e.preventDefault(); moveToCell(n); } return; }
      if(e.key === 'ArrowLeft'){
        if(inp.selectionStart===0 && inp.selectionEnd===0){ const n=neighborAddr(inp.dataset.addr,'left'); if(n){ e.preventDefault(); moveToCell(n); } }
        return;
      }
      if(e.key === 'ArrowRight'){
        const len = inp.value.length;
        if(inp.selectionStart===len && inp.selectionEnd===len){ const n=neighborAddr(inp.dataset.addr,'right'); if(n){ e.preventDefault(); moveToCell(n); } }
        return;
      }
    });
  });

  /* セルのクリック（範囲選択・オートフィル・行列選択・数式へのセル参照挿入） */
  grid.querySelectorAll('td[data-addr]').forEach(td=>{
    td.addEventListener('mousedown', (e)=>{
      const addr = td.dataset.addr;
      if(fillMode){
        e.preventDefault();
        fillDown(fillSourceAddr, addr);
        fillMode = false;
        const btn = document.querySelector('.tbtn[data-tool="autofill"]');
        if(btn) btn.classList.remove('on');
        return;
      }
      if(isFormulaEditing() && activeFormulaAddr !== addr){
        e.preventDefault();
        if(formulaRefAnchor && formulaRefAnchor.el===activeFormulaEl){
          if(e.shiftKey){
            const rangeText = formulaRefAnchor.addr + ':' + addr;
            const span = replaceSpan(activeFormulaEl, activeFormulaAddr, formulaRefAnchor.start, formulaRefAnchor.end, rangeText);
            formulaRefAnchor = {el:activeFormulaEl, addr:formulaRefAnchor.addr, start:span.start, end:span.end};
          } else {
            const span = replaceSpan(activeFormulaEl, activeFormulaAddr, formulaRefAnchor.start, formulaRefAnchor.end, addr);
            formulaRefAnchor = {el:activeFormulaEl, addr, start:span.start, end:span.end};
          }
        } else {
          const span = insertRefAtCursor(activeFormulaEl, activeFormulaAddr, addr);
          formulaRefAnchor = {el:activeFormulaEl, addr, start:span.start, end:span.end};
        }
        if(!e.shiftKey) startFormulaDrag(addr);
        return;
      }
      if(e.shiftKey && ctx.selectedAddr){
        e.preventDefault();
        const a = addrParts(ctx.selectedAddr), b = addrParts(addr);
        setRange(a.row, colToIndex(a.col), b.row, colToIndex(b.col));
      } else {
        startRangeDrag(addr);
      }
    });
  });

  /* フィルハンドルのドラッグ操作（本物のExcelに近いオートフィル） */
  let dragFillActive = false, dragFillSource = null, dragFillCurrentAddr = null;
  let formulaDragActive = false, formulaDragAnchor = null, formulaDragCurrent = null;

  function onFormulaDragMove(e){
    if(!formulaDragActive) return;
    if(e.cancelable) e.preventDefault();
    const pt = pointFromEvent(e);
    const el = document.elementFromPoint(pt.clientX, pt.clientY);
    const td = el && el.closest ? el.closest('td[data-addr]') : null;
    if(!td) return;
    const addr = td.dataset.addr;
    if(addr === formulaDragCurrent) return;
    formulaDragCurrent = addr;
    const rangeText = addr===formulaDragAnchor ? formulaDragAnchor : formulaDragAnchor+':'+addr;
    if(formulaRefAnchor && formulaRefAnchor.el===activeFormulaEl){
      const span = replaceSpan(activeFormulaEl, activeFormulaAddr, formulaRefAnchor.start, formulaRefAnchor.end, rangeText);
      formulaRefAnchor = {el:activeFormulaEl, addr:formulaDragAnchor, start:span.start, end:span.end};
    }
  }
  function onFormulaDragEnd(){
    formulaDragActive = false;
    formulaDragAnchor = null; formulaDragCurrent = null;
    document.removeEventListener('mousemove', onFormulaDragMove);
    document.removeEventListener('mouseup', onFormulaDragEnd);
    document.removeEventListener('touchmove', onFormulaDragMove);
    document.removeEventListener('touchend', onFormulaDragEnd);
  }
  function startFormulaDrag(addr){
    formulaDragActive = true; formulaDragAnchor = addr; formulaDragCurrent = addr;
    document.addEventListener('mousemove', onFormulaDragMove);
    document.addEventListener('mouseup', onFormulaDragEnd);
    document.addEventListener('touchmove', onFormulaDragMove, {passive:false});
    document.addEventListener('touchend', onFormulaDragEnd);
    window.__excelDragCleanup.push(onFormulaDragEnd);
  }

  /* 通常の範囲選択のドラッグ操作（書式・並べ替え・グラフなどの範囲選択） */
  let rangeDragActive = false, rangeDragAnchor = null;
  function onRangeDragMove(e){
    if(!rangeDragActive) return;
    if(e.cancelable) e.preventDefault();
    const pt = pointFromEvent(e);
    const el = document.elementFromPoint(pt.clientX, pt.clientY);
    const td = el && el.closest ? el.closest('td[data-addr]') : null;
    if(!td) return;
    const addr = td.dataset.addr;
    if(addr === rangeDragAnchor) return;
    const a = addrParts(rangeDragAnchor), b = addrParts(addr);
    setRange(a.row, colToIndex(a.col), b.row, colToIndex(b.col));
  }
  function onRangeDragEnd(){
    rangeDragActive = false; rangeDragAnchor = null;
    document.removeEventListener('mousemove', onRangeDragMove);
    document.removeEventListener('mouseup', onRangeDragEnd);
    document.removeEventListener('touchmove', onRangeDragMove);
    document.removeEventListener('touchend', onRangeDragEnd);
  }
  function startRangeDrag(addr){
    rangeDragActive = true; rangeDragAnchor = addr;
    document.addEventListener('mousemove', onRangeDragMove);
    document.addEventListener('mouseup', onRangeDragEnd);
    document.addEventListener('touchmove', onRangeDragMove, {passive:false});
    document.addEventListener('touchend', onRangeDragEnd);
    window.__excelDragCleanup.push(onRangeDragEnd);
  }

  function clearFillPreview(){
    grid.querySelectorAll('td.fill-preview').forEach(t=>t.classList.remove('fill-preview'));
  }
  function updateFillPreview(destAddr){
    clearFillPreview();
    const sp = addrParts(dragFillSource), dp = addrParts(destAddr);
    if(sp.col !== dp.col || dp.row <= sp.row) return;
    for(let r=sp.row+1; r<=dp.row; r++){
      const t = grid.querySelector(`td[data-addr="${sp.col+r}"]`);
      if(t) t.classList.add('fill-preview');
    }
  }
  function pointFromEvent(e){ return e.touches && e.touches.length ? e.touches[0] : e; }
  function onDragFillMove(e){
    if(!dragFillActive) return;
    if(e.cancelable) e.preventDefault();
    const pt = pointFromEvent(e);
    const el = document.elementFromPoint(pt.clientX, pt.clientY);
    const td = el && el.closest ? el.closest('td[data-addr]') : null;
    if(!td) return;
    const addr = td.dataset.addr;
    const sp = addrParts(dragFillSource), dp = addrParts(addr);
    if(sp.col !== dp.col) return;
    dragFillCurrentAddr = addr;
    updateFillPreview(addr);
  }
  function onDragFillEnd(){
    if(!dragFillActive) return;
    dragFillActive = false;
    clearFillPreview();
    if(dragFillCurrentAddr){
      const sp = addrParts(dragFillSource), dp = addrParts(dragFillCurrentAddr);
      if(sp.col===dp.col && dp.row>sp.row){ fillDown(dragFillSource, dragFillCurrentAddr); }
    }
    dragFillSource = null; dragFillCurrentAddr = null;
    document.removeEventListener('mousemove', onDragFillMove);
    document.removeEventListener('mouseup', onDragFillEnd);
    document.removeEventListener('touchmove', onDragFillMove);
    document.removeEventListener('touchend', onDragFillEnd);
  }
  function startDragFill(addr){
    if(addr !== ctx.selectedAddr) return;
    if(!values[addr]) return;
    dragFillActive = true; dragFillSource = addr; dragFillCurrentAddr = addr;
    document.addEventListener('mousemove', onDragFillMove);
    document.addEventListener('mouseup', onDragFillEnd);
    document.addEventListener('touchmove', onDragFillMove, {passive:false});
    document.addEventListener('touchend', onDragFillEnd);
    window.__excelDragCleanup.push(onDragFillEnd);
  }
  grid.querySelectorAll('.fill-handle').forEach(handle=>{
    handle.addEventListener('mousedown', (e)=>{ e.preventDefault(); e.stopPropagation(); startDragFill(handle.dataset.addr); });
    handle.addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); startDragFill(handle.dataset.addr); }, {passive:false});
  });

  grid.querySelectorAll('td.rownum[data-row]').forEach(td=>{
    td.addEventListener('click', ()=>{
      const r = Number(td.dataset.row);
      setRange(r, 0, r, cols-1, {wholeRow:true});
      ctx.selectedAddr = indexToCol(0)+r;
      nameBox.value = 'A'+r+':'+indexToCol(cols-1)+r;
    });
  });
  grid.querySelectorAll('th[data-col]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const c = colToIndex(th.dataset.col);
      setRange(1, c, rows, c, {wholeCol:true});
      ctx.selectedAddr = th.dataset.col+'1';
      nameBox.value = th.dataset.col+'1:'+th.dataset.col+rows;
    });
  });

  formulaBar.addEventListener('focus', ()=>{ activeFormulaEl = formulaBar; activeFormulaAddr = ctx.selectedAddr; formulaRefAnchor = null; });
  formulaBar.addEventListener('input', ()=>{
    if(!ctx.selectedAddr) return;
    values[ctx.selectedAddr] = formulaBar.value;
    const input = grid.querySelector(`input[data-addr="${ctx.selectedAddr}"]`);
    if(input) input.value = formulaBar.value;
    formulaRefAnchor = null;
    refreshAllDisplays();
  });
  formulaBar.addEventListener('keydown', (e)=>{
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      if(ctx.selectedAddr){
        const next = neighborAddr(ctx.selectedAddr, 'down');
        if(next) moveToCell(next);
      }
    }
  });

  /* ツールバーのボタン */
  document.querySelectorAll('.tbtn').forEach(btn=>{
    const tool = btn.dataset.tool;
    btn.addEventListener('click', ()=>{
      const targets = selectionAddrs();
      if(tool==='bold' || tool==='fill' || tool==='border'){
        if(targets.length===0) return;
        const refState = styles[targets[0]] && styles[targets[0]][tool];
        targets.forEach(a=>{ styles[a] = styles[a]||{}; styles[a][tool] = !refState; });
      } else if(tool==='center'){
        if(targets.length===0) return;
        const refState = styles[targets[0]] && styles[targets[0]].align==='center';
        targets.forEach(a=>{ styles[a] = styles[a]||{}; styles[a].align = refState ? 'left' : 'center'; });
      } else if(tool==='comma' || tool==='currency' || tool==='percent'){
        if(targets.length===0) return;
        const refState = styles[targets[0]] && styles[targets[0]].format===tool;
        targets.forEach(a=>{ styles[a] = styles[a]||{}; styles[a].format = refState ? null : tool; });
      } else if(tool==='decUp' || tool==='decDown'){
        if(targets.length===0) return;
        const sh = freshSheet();
        const first = targets.find(a=>typeof sh.value(a)==='number');
        if(first===undefined) return;
        const fst = styles[first] || {};
        const cur = (typeof fst.decimals==='number') ? fst.decimals : countDecimals(sh.value(first), fst.format);
        const next = tool==='decUp' ? Math.min(cur+1,6) : Math.max(cur-1,0);
        targets.forEach(a=>{ if(typeof sh.value(a)!=='number') return; styles[a] = styles[a]||{}; styles[a].decimals = next; });
      } else if(tool==='gridThin' || tool==='outerThick'){
        if(targets.length===0) return;
        let r1, r2, c1, c2;
        if(ctx.selectedRange){ ({r1,r2,c1,c2} = ctx.selectedRange); }
        else { const m = ctx.selectedAddr.match(/^([A-Z]+)(\d+)$/); r1 = r2 = Number(m[2]); c1 = c2 = colToIndex(m[1]); }
        const setEdge = (c, r, side, w, mark)=>{
          if(r<1 || r>rows || c<0 || c>=cols) return;
          const a = indexToCol(c)+r; const st = styles[a] = styles[a]||{};
          st.edges = st.edges || {}; st.edges[side] = w; if(mark) st.border = true;
        };
        const w = tool==='gridThin' ? 'thin' : 'thick';
        for(let r=r1;r<=r2;r++){ for(let c=c1;c<=c2;c++){
          if(tool==='gridThin'){
            ['t','b','l','r'].forEach(sd=>setEdge(c,r,sd,w,true));
          } else {
            if(r===r1) setEdge(c,r,'t',w,true);
            if(r===r2) setEdge(c,r,'b',w,true);
            if(c===c1) setEdge(c,r,'l',w,true);
            if(c===c2) setEdge(c,r,'r',w,true);
          }
        } }
        /* となりのセルの、同じ線にあたる辺もそろえる */
        for(let c=c1;c<=c2;c++){
          setEdge(c,r1-1,'b',w,false); setEdge(c,r2+1,'t',w,false);
        }
        for(let r=r1;r<=r2;r++){ setEdge(c1-1,r,'r',w,false); setEdge(c2+1,r,'l',w,false); }
      } else if(tool==='autofill'){
        if(!ctx.selectedAddr) return;
        fillSourceAddr = ctx.selectedAddr;
        fillMode = true;
        btn.classList.add('on');
      } else if(tool==='sortAsc' || tool==='sortDesc'){
        if(!ctx.selectedRange) { showFeedback(false, '先に並べ替えたい範囲を選びましょう。'); return; }
        performSort(ctx.selectedRange, step.sortKeyOffset||0, tool==='sortAsc'?'asc':'desc');
        ctx.sorted = true;
        return;
      } else if(tool==='lock'){
        if(targets.length===0) return;
        targets.forEach(a=>{ ctx.locked[a] = !ctx.locked[a]; });
      } else if(tool==='inputRule'){
        if(targets.length===0) return;
        targets.forEach(a=>{ ctx.ruleSet[a] = !ctx.ruleSet[a]; });
      } else if(tool==='protectSheet'){
        ctx.sheetProtected = true;
        btn.classList.add('on');
      } else if(tool==='chart'){
        if(!ctx.selectedRange){ showFeedback(false, '先にグラフのもとになる範囲を選びましょう。'); return; }
        renderChart(ctx.selectedRange);
        ctx.chartGenerated = true;
        ctx.chartRange = ctx.selectedRange;
        return;
      }
      refreshAllDisplays();
    });
  });

  refreshAllDisplays();

  const hintBtnExcel = document.getElementById('hintBtnExcel');
  if(hintBtnExcel){
    hintBtnExcel.onclick = ()=> toggleHint(step, 'hintAreaPane', 'hintBtnExcel');
  }

  const funcPicker = document.getElementById('funcPicker');
  if(funcPicker){
    funcPicker.addEventListener('change', ()=>{
      const name = funcPicker.value;
      funcPicker.value = '';
      if(!name || !ctx.selectedAddr) return;
      const current = values[ctx.selectedAddr] || '';
      let newVal;
      if(!current.trim() || current.trim()==='='){
        newVal = '=' + name + '()';
      } else {
        const pos = (document.activeElement===formulaBar) ? (formulaBar.selectionStart||current.length) : current.length;
        newVal = current.slice(0,pos) + name + '()' + current.slice(pos);
      }
      values[ctx.selectedAddr] = newVal;
      const input = grid.querySelector(`input[data-addr="${ctx.selectedAddr}"]`);
      if(input) input.value = newVal;
      formulaBar.value = newVal;
      refreshAllDisplays();
      formulaBar.focus();
      const caretPos = newVal.lastIndexOf(name+'(') + name.length + 1;
      formulaBar.setSelectionRange(caretPos, caretPos);
    });
  }

  document.getElementById('mainBtn').onclick = ()=>{
    const fullWidthRe = /[\uFF01-\uFF5E]/;
    const initVals = step.initial || {};
    const offenders = Object.keys(values).filter(addr => typeof values[addr]==='string' && values[addr]!==initVals[addr] && fullWidthRe.test(values[addr]));
    if(offenders.length > 0){
      showFeedback(false, '全角で入力されているセルがあります（' + offenders.join('、') + '）。数字・記号・アルファベットは半角で入力し直しましょう。');
      return;
    }
    const sheet = freshSheet();
    const res = step.check(sheet, ctx);
    if(res.ok){
      showFeedback(true, res.msg||'');
      markStepDone(studyState.courseId, unit.id, studyState.stepIndex);
      enableNextButton();
      afterStepDone(studyState.courseId, unit);
    } else {
      showFeedback(false, res.msg||'');
    }
  };
}

/* =========================================================
   ヘッダーナビゲーション
   ========================================================= */
document.getElementById('brandBtn').onclick = ()=>{ view = {name:'home'}; render(); };
document.getElementById('navHome').onclick = ()=>{ view = {name:'home'}; render(); };
document.getElementById('navCourses').onclick = ()=>{ view = {name:'courses', filter:'all'}; render(); };
document.getElementById('navExam').onclick = ()=>{ view = {name:'exam'}; render(); };
document.getElementById('navShokyu').onclick = ()=>{ view = {name:'unitList', courseId:'shokyu', levelId:'pc'}; render(); };
document.getElementById('navChukyu').onclick = ()=>{ view = {name:'unitList', courseId:'chukyu', levelId:'excel'}; render(); };
document.getElementById('navJokyu').onclick = ()=>{ view = {name:'unitList', courseId:'jokyu', levelId:'excel'}; render(); };
document.getElementById('navKentei').onclick = ()=>{ view = {name:'unitList', courseId:'kentei', levelId:'grade4'}; render(); };

render();
initSync();
</script>
